version: '3.8'

services:
  redis:
    image: redis:7.2-alpine
    container_name: redis-cache
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_USER}/breast-cancer-api:${IMAGE_TAG}
    container_name: fastapi-api
    ports:
      - "${HOST_PORT}:8000"
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - LOG_LEVEL=INFO
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data: